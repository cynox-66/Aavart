services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-railniyojan}
      POSTGRES_USER: ${POSTGRES_USER:-railniyojan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railniyojan_dev}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc \"SELECT 1 FROM pg_extension WHERE extname = 'postgis'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "railniyojan.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/backend/src
      - ./fixtures:/app/fixtures:ro
      - ./openapi:/app/openapi
    depends_on:
      db:
        condition: service_healthy

  optimizer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "railniyojan.optimizer.worker"]
    env_file: .env
    volumes:
      - ./backend/src:/app/backend/src
      - ./fixtures:/app/fixtures:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  postgres_data:
