services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-railniyojan}
      POSTGRES_USER: ${POSTGRES_USER:-railniyojan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railniyojan_dev}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc \"SELECT 1 FROM pg_extension WHERE extname = 'postgis'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Migrations run here rather than as a separate host step: DATABASE_URL
    # points at `db:5432`, which only resolves inside this network, so
    # `make migrate` on the host cannot reach it. Keeps `make dev` one command.
    command: ["sh", "-c", "alembic -c backend/alembic.ini upgrade head && exec uvicorn railniyojan.api.main:app --host 0.0.0.0 --port 8000 --reload"]
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/backend/src
      - ./fixtures:/app/fixtures:ro
      - ./openapi:/app/openapi
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Baked in at build time -- see the ARG in apps/web/Dockerfile. Setting
      # this only under `environment:` would be silently ignored by the browser.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
