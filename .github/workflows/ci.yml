name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --project backend --dev
      - run: uv run --project backend ruff check backend
      # --config-file: mypy looks for [tool.mypy] in the working directory, so
      # without this it runs from the repo root with neither `strict` nor the
      # pydantic plugin - a weaker check than the project declares.
      - run: uv run --project backend mypy --config-file backend/pyproject.toml backend/src
      - run: uv run --project backend pytest backend/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm typecheck:web
      - run: pnpm test:web
      - run: pnpm build:web
      # The e2e suite drives the real API, and playwright.config.ts starts it.
      # Without the backend toolchain here that server cannot boot and every
      # spec past the landing page fails.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --project backend --dev
      - run: pnpm --filter @railniyojan/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
